name: abaplint

on:
  push:
  pull_request:

jobs:
  abaplint:
    timeout-minutes: 10
    name: abaplint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run abaplint
        run: |
          npm -g install @abaplint/cli
          abaplint --format codeframe
